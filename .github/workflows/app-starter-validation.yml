name: Validate App Starter Generator
on:
  pull_request:
    paths:
      - 'app-starter/**'
      - 'app-design/templates/**'
      - 'app-design/DESIGN_TO_BUILD_CONTRACT.md'
      - '.github/workflows/app-starter-validation.yml'
  push:
    branches: [main]
    paths:
      - 'app-starter/**'
      - 'app-design/templates/**'
      - 'app-design/DESIGN_TO_BUILD_CONTRACT.md'
      - '.github/workflows/app-starter-validation.yml'
jobs:
  validate-starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check bash syntax
        run: bash -n app-starter/scripts/new-app.sh
      - name: Run web and iOS design generation tests
        run: python3 -m unittest discover -s app-starter/tests -p 'test_*.py' -v
