name: SEO round 2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seo-round2.yml

permissions:
  contents: write

jobs:
  seo-round2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply SEO round 2 improvements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = 'https://graymatterdigitalsolutions.com/'
          OLD_HOME = ROOT + 'index.html'
          TODAY = '2026-09-14'

          # 1) Normalize absolute homepage references used in canonicals/structured data.
          files = list(Path('.').glob('*.html')) + list(Path('services').glob('*.html')) + list(Path('industries').glob('*.html')) + [Path('sitemap.xml')]
          replacements = 0
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count(OLD_HOME)
              if count:
                  text = text.replace(OLD_HOME, ROOT)
                  path.write_text(text, encoding='utf-8')
                  replacements += count
          print(f'Normalized {replacements} absolute homepage references.')

          # 2) Strengthen the homepage entity/site-name signals without changing visible brand copy.
          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          if '"@id": "https://graymatterdigitalsolutions.com/#organization"' not in text:
              needle = '    "@type": "ProfessionalService",\n    "name": "Gray Matter LLC",'
              repl = '    "@type": "ProfessionalService",\n    "@id": "https://graymatterdigitalsolutions.com/#organization",\n    "name": "Gray Matter LLC",'
              if needle not in text:
                  raise SystemExit('Could not find homepage ProfessionalService schema anchor.')
              text = text.replace(needle, repl, 1)
          if '"logo": "https://graymatterdigitalsolutions.com/assets/gray-matter-media-package/brand/approved-reference/gm-logo-horizontal-approved.png"' not in text:
              needle = '    "url": "https://graymatterdigitalsolutions.com/",\n    "email": "graymattertechllc@gmail.com",'
              repl = '    "url": "https://graymatterdigitalsolutions.com/",\n    "logo": "https://graymatterdigitalsolutions.com/assets/gray-matter-media-package/brand/approved-reference/gm-logo-horizontal-approved.png",\n    "email": "graymattertechllc@gmail.com",'
              if needle not in text:
                  raise SystemExit('Could not find homepage Organization URL/email schema anchor.')
              text = text.replace(needle, repl, 1)

          if '"@type": "WebSite"' not in text:
              website_schema = '''  <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "@id": "https://graymatterdigitalsolutions.com/#website",
            "url": "https://graymatterdigitalsolutions.com/",
            "name": "Gray Matter",
            "alternateName": "Gray Matter LLC",
            "publisher": { "@id": "https://graymatterdigitalsolutions.com/#organization" }
          }
          </script>
          '''
              if '</head>' not in text:
                  raise SystemExit('Homepage </head> not found.')
              text = text.replace('</head>', website_schema + '</head>', 1)
          home.write_text(text, encoding='utf-8')

          # 3) Align the main visible headings of the highest-value commercial pages with their search intent.
          h1_changes = {
              Path('services.html'): (
                  '<h1>Everything Gray Matter Can Build For You</h1>',
                  '<h1>Small Business Technology Services Built Around What You Need</h1>'
              ),
              Path('services/business-websites.html'): (
                  '<h1>Your Website Should Do More Than Look Good</h1>',
                  '<h1>Small Business Websites That Do More Than Look Good</h1>'
              ),
              Path('services/workflow-automation.html'): (
                  '<h1>What Are You Tired of Doing Over and Over?</h1>',
                  '<h1>Workflow Automation for the Work You Do Over and Over</h1>'
              ),
          }
          for path, (old, new) in h1_changes.items():
              page = path.read_text(encoding='utf-8')
              if new in page:
                  continue
              if old not in page:
                  raise SystemExit(f'Expected H1 not found in {path}.')
              path.write_text(page.replace(old, new, 1), encoding='utf-8')

          # 4) Add useful, truthful local-intent content to the website-design service page.
          web_page = Path('services/business-websites.html')
          page = web_page.read_text(encoding='utf-8')
          if 'id="montgomery-web-design"' not in page:
              section = '''  <!-- MONTGOMERY WEBSITE DESIGN -->
          <section class="section-pad section-paper" id="montgomery-web-design">
            <div class="container">
              <div class="text-center">
                <span class="section-label">Montgomery, Alabama + Nationwide</span>
                <h2 class="section-title">Small Business Website Design Built for Real Customer Actions</h2>
                <p class="section-subtitle">Gray Matter is based in Montgomery, Alabama and works with small businesses locally and remotely across the United States. The goal is not just a nicer site &mdash; it is a site that makes it easier for customers to find you, understand what you offer, and contact, book, request a quote, or pay.</p>
              </div>
              <div class="grid-2" style="gap:1.5rem;max-width:920px;margin:2rem auto 0;">
                <article class="card fade-up">
                  <h3>How much does a small business website cost?</h3>
                  <p>Website packages currently start at $750 for an Essential Site and $1,500 for a Business Site. Final pricing depends on the number of pages, booking or payment features, content work, and integrations. <a href="../pricing.html" style="color:var(--gm-blue);font-weight:600;">See current website pricing.</a></p>
                </article>
                <article class="card fade-up">
                  <h3>Do you only build websites for Montgomery businesses?</h3>
                  <p>No. Gray Matter is based in Montgomery and serves local businesses, but website projects can be delivered remotely for clients nationwide.</p>
                </article>
                <article class="card fade-up">
                  <h3>Can the site handle booking, quote requests, or payments?</h3>
                  <p>Yes. Those features can be included when they fit the business. We scope the customer action first, then build the website and integrations around it.</p>
                </article>
                <article class="card fade-up">
                  <h3>Is search visibility considered during the build?</h3>
                  <p>Yes. Current website packages include basic or on-page SEO work as listed on the pricing page, and deeper search setup can be scoped when the business needs it.</p>
                </article>
              </div>
            </div>
          </section>

          '''
              marker = '  <!-- CLOSING CTA -->'
              if marker not in page:
                  raise SystemExit('Business websites closing CTA marker not found.')
              page = page.replace(marker, section + marker, 1)
              web_page.write_text(page, encoding='utf-8')

          # 5) Add explicit Service structured data to the cloud consulting page.
          cloud = Path('cloud-consulting.html')
          page = cloud.read_text(encoding='utf-8')
          if '"serviceType": "AWS Cloud, DevOps and Security Consulting"' not in page:
              cloud_schema = '''  <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Service",
            "name": "Cloud Consulting",
            "serviceType": "AWS Cloud, DevOps and Security Consulting",
            "description": "AWS cloud infrastructure, DevOps automation, cloud security, logging, and technology consulting for contract and project-based engagements.",
            "url": "https://graymatterdigitalsolutions.com/cloud-consulting.html",
            "provider": { "@id": "https://graymatterdigitalsolutions.com/#organization" },
            "areaServed": { "@type": "Country", "name": "United States" }
          }
          </script>
          '''
              if '</head>' not in page:
                  raise SystemExit('Cloud consulting </head> not found.')
              page = page.replace('</head>', cloud_schema + '</head>', 1)
              cloud.write_text(page, encoding='utf-8')

          # 6) Keep sitemap lastmod accurate for pages that received substantive Round 2 edits.
          sitemap = Path('sitemap.xml')
          xml = sitemap.read_text(encoding='utf-8')
          changed_urls = [
              'https://graymatterdigitalsolutions.com/',
              'https://graymatterdigitalsolutions.com/services.html',
              'https://graymatterdigitalsolutions.com/services/business-websites.html',
              'https://graymatterdigitalsolutions.com/services/workflow-automation.html',
              'https://graymatterdigitalsolutions.com/cloud-consulting.html',
          ]
          for url in changed_urls:
              pattern = rf'(<loc>{re.escape(url)}</loc><lastmod>)[^<]+(</lastmod>)'
              xml, n = re.subn(pattern, rf'\g<1>{TODAY}\g<2>', xml, count=1)
              if n != 1:
                  raise SystemExit(f'Could not update sitemap lastmod for {url}')
          sitemap.write_text(xml, encoding='utf-8')
          PY

      - name: Verify SEO round 2
        shell: bash
        run: |
          grep -F '<link rel="canonical" href="https://graymatterdigitalsolutions.com/" />' index.html
          grep -F '"@type": "WebSite"' index.html
          grep -F '"@id": "https://graymatterdigitalsolutions.com/#organization"' index.html
          grep -F '<h1>Small Business Technology Services Built Around What You Need</h1>' services.html
          grep -F '<h1>Small Business Websites That Do More Than Look Good</h1>' services/business-websites.html
          grep -F 'id="montgomery-web-design"' services/business-websites.html
          grep -F '<h1>Workflow Automation for the Work You Do Over and Over</h1>' services/workflow-automation.html
          grep -F '"serviceType": "AWS Cloud, DevOps and Security Consulting"' cloud-consulting.html
          ! grep -R -F 'https://graymatterdigitalsolutions.com/index.html' --include='*.html' --include='*.xml' .

      - name: Commit SEO round 2 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html services/business-websites.html services/workflow-automation.html cloud-consulting.html sitemap.xml industries/*.html services/*.html *.html
          if git diff --cached --quiet; then
            echo "No SEO Round 2 changes needed."
            exit 0
          fi
          git commit -m "SEO round 2: strengthen search intent and structured data"
          git push origin HEAD:main
