name: Design deliverables structural gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  design-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check mandatory design deliverables
        run: python3 scripts/check-design.py --stage design
