workflows:
  ios-compile:
    name: Native iOS - unsigned compile check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project and compile for Simulator
        script: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          if ! xcodebuild -project GrayMatterStarter.xcodeproj \
            -scheme GrayMatterStarter \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$CM_BUILD_DIR/ios-build.log" 2>&1; then
            cat "$CM_BUILD_DIR/ios-build.log"
            exit 1
          fi
    artifacts:
      - ios-build.log
